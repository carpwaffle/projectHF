<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>City Kit Viewer</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #8fb8de; font-family: system-ui, sans-serif; }
    canvas { display: block; width: 100vw; height: 100vh; cursor: grab; }
    #panel { position: fixed; top: 12px; left: 12px; display: flex; flex-direction: column; gap: 8px; padding: 12px;
      background: rgba(13, 15, 18, 0.85); color: #fff; border-radius: 8px; width: 240px; font-size: 13px; }
    #panel h2 { margin: 0; font-size: 14px; letter-spacing: 1px; }
    input { font: inherit; padding: 6px; border-radius: 4px; border: 1px solid #444; background: #1d2127; color: #fff; }
    #stats { color: #aaa; white-space: pre-line; font-variant-numeric: tabular-nums; }
    .hint { color: #777; font-size: 12px; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <canvas id="view"></canvas>
  <div id="panel">
    <h2>CITY KIT</h2>
    <input id="filter" placeholder="Filter pieces (e.g. stairs, floor)" />
    <div id="stats">Loading…</div>
    <span class="hint">Drag to orbit · right-drag to pan · scroll to zoom</span>
  </div>
  <script type="module" src="src/kit.js"></script>
</body>
</html>
