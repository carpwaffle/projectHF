<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hack FPS</title>
  <link rel="stylesheet" href="style.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/",
        "three-mesh-bvh": "https://cdn.jsdelivr.net/npm/three-mesh-bvh@0.9.16/build/index.module.js",
        "peerjs": "https://cdn.jsdelivr.net/npm/peerjs@1.5.4/+esm"
      }
    }
  </script>
</head>
<body>
  <canvas id="view"></canvas>

  <div id="menu" class="overlay">
    <div class="panel">
      <h1>HACK FPS</h1>
      <label>Name <input id="name" maxlength="16" placeholder="Player" /></label>
      <button id="hostBtn">Host Game</button>
      <div class="row">
        <input id="codeInput" maxlength="5" placeholder="ROOM CODE" />
        <button id="joinBtn">Join</button>
      </div>
      <p id="status"></p>
    </div>
  </div>

  <div id="hud" hidden>
    <div id="crosshair"></div>
    <div id="crosshairTicks"><i></i><i></i><i></i><i></i></div>
    <div id="hitmarker"></div>
    <div id="damageDirs"></div>
    <div id="killConfirm"></div>
    <div id="protectMsg" hidden></div>
    <div id="damage"></div>
    <div id="heal"></div>
    <div id="cash"></div>
    <div id="roomInfo"></div>
    <div id="teamScore"></div>
    <div id="killfeed"></div>
    <div id="hp">200</div>
    <div id="scope" hidden></div>
    <div id="weaponName"></div>
    <div id="ammo"><span id="ammoCount">30</span> / <span id="magSize">30</span></div>
    <div id="reloadMsg" hidden>Reloading…</div>
    <div id="deadMsg" hidden>You died — respawning…</div>
    <div id="clickToPlay">Click to play</div>
    <div id="money">$0</div>
    <div id="hackName"></div>
    <canvas id="minimap" width="220" height="220" hidden></canvas>
    <div id="victory" hidden></div>
    <table id="scoreboard" hidden></table>
  </div>

  <!-- Shown on joining and after every death: pick the weapon to spawn with. -->
  <div id="buyMenu" class="overlay" hidden>
    <div class="panel buy">
      <h2 id="buyTitle">Choose your loadout</h2>
      <p id="buyInfo"></p>
      <div id="buyMoney"></div>
      <div class="buyCols">
        <div><h3>Weapon</h3><div id="buyList" role="radiogroup"></div></div>
        <div><h3>Hack</h3><div id="buyHacks" role="radiogroup"></div></div>
      </div>
      <div id="buyTotal"></div>
      <button id="buyStart">Start</button>
      <p class="help">WASD move · Space jump · Mouse aim · Click shoot · R reload · M mute · Tab scores · Esc release mouse</p>
    </div>
  </div>

  <script type="module" src="src/main.js"></script>
</body>
</html>
