<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Character Preview</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #8fb8de; font-family: system-ui, sans-serif; }
    canvas { display: block; width: 100vw; height: 100vh; cursor: grab; }
    #crosshair { position: fixed; left: 50%; top: 50%; width: 4px; height: 4px; margin: -2px; background: #fff; border-radius: 50%; box-shadow: 0 0 2px #000; pointer-events: none; }
    #crosshair[hidden] { display: none; }
    #panel { position: fixed; top: 12px; left: 12px; display: flex; flex-direction: column; gap: 8px; padding: 12px;
      background: rgba(13, 15, 18, 0.85); color: #fff; border-radius: 8px; width: 220px; font-size: 13px; }
    #panel h2 { margin: 0; font-size: 14px; letter-spacing: 1px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    button { font: inherit; padding: 6px; border-radius: 4px; border: 1px solid #444; background: #1d2127; color: #fff; cursor: pointer; }
    button.on { background: #2d6cdf; border-color: #2d6cdf; }
    label { display: flex; flex-direction: column; gap: 4px; color: #aaa; }
    .hint { color: #777; font-size: 12px; }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <canvas id="view"></canvas>
  <div id="crosshair" hidden></div>
  <div id="panel">
    <h2>CHARACTER PREVIEW</h2>
    <div class="grid" style="grid-template-columns: auto 1fr auto; align-items: center;">
      <button id="prevSkin">◀</button>
      <span id="skinName" style="text-align: center;">Loading…</span>
      <button id="nextSkin">▶</button>
    </div>
    <div class="grid" id="views"></div>
    <div class="grid" id="weapons"></div>
    <div class="grid" id="moves"></div>
    <div class="grid">
      <button id="jump">Jump</button>
      <button id="crouch">Crouch</button>
      <button id="fire">Auto-fire</button>
      <button id="reload">Reload</button>
      <button id="die">Die</button>
      <button id="spin">Turntable</button>
      <button id="boxes">Hitboxes</button>
    </div>
    <label>Aim pitch <input id="pitch" type="range" min="-1.4" max="1.4" step="0.01" value="0" /></label>
    <label>Speed <input id="speed" type="range" min="0.2" max="1" step="0.01" value="1" /></label>
    <span class="hint" id="hint"></span>
  </div>
  <script type="module" src="src/preview.js"></script>
</body>
</html>
